<section class="search-notes-section">
  <div class="toolbar">
    <div class="search-wrap">
      <svg
        version="1.1"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        width="17"
        height="17"
        viewBox="0 0 17 17"
      >
        <g></g>
        <path
          d="M16.604 15.868l-5.173-5.173c0.975-1.137 1.569-2.611 1.569-4.223 0-3.584-2.916-6.5-6.5-6.5-1.736 0-3.369 0.676-4.598 1.903-1.227 1.228-1.903 2.861-1.902 4.597 0 3.584 2.916 6.5 6.5 6.5 1.612 0 3.087-0.594 4.224-1.569l5.173 5.173 0.707-0.708zM6.5 11.972c-3.032 0-5.5-2.467-5.5-5.5-0.001-1.47 0.571-2.851 1.61-3.889 1.038-1.039 2.42-1.611 3.89-1.611 3.032 0 5.5 2.467 5.5 5.5 0 3.032-2.468 5.5-5.5 5.5z"
          fill="#000000"
        />
      </svg>

      <input
        class="form-control primary-font-medium"
        type="text"
        id="search"
        placeholder="Search notes…"
        (input)="handleSearch($event)"
      />
    </div>

    <app-button [variant]="'secondary'" [size]="'md'" (clicked)="openNewNote()">
      <span class="btn-content">
        <svg
          version="1.1"
          xmlns="http://www.w3.org/2000/svg"
          xmlns:xlink="http://www.w3.org/1999/xlink"
          width="17"
          height="17"
          viewBox="0 0 17 17"
        >
          <g></g>
          <path d="M16 9h-7v7h-1v-7h-7v-1h7v-7h1v7h7v1z" fill="#000000" />
        </svg>
        New note
      </span>
    </app-button>

    <app-button [variant]="'primary'" [size]="'md'" (clicked)="logout()">
      <span class="btn-content"> Logout </span>
    </app-button>
  </div>

  <div class="filter-bar" id="filterBar">
    <app-button
      [variant]="'secondary'"
      [size]="'sm'"
      [rounded]="true"
      (clicked)="handleNotesByCategory('all')"
      [isActive]="activeCategory === 'all'"
      >All</app-button
    >
    <app-button
      [variant]="'secondary'"
      [size]="'sm'"
      [rounded]="true"
      (clicked)="handleNotesByCategory('work')"
      [isActive]="activeCategory === 'work'"
      >Work</app-button
    >
    <app-button
      [variant]="'secondary'"
      [size]="'sm'"
      [rounded]="true"
      (clicked)="handleNotesByCategory('personal')"
      [isActive]="activeCategory === 'personal'"
      >Personal</app-button
    >
    <app-button
      [variant]="'secondary'"
      [size]="'sm'"
      [rounded]="true"
      (clicked)="handleNotesByCategory('ideas')"
      [isActive]="activeCategory === 'ideas'"
      >Ideas</app-button
    >
    <app-button
      [variant]="'secondary'"
      [size]="'sm'"
      [rounded]="true"
      (clicked)="handleNotesByCategory('urgent')"
      [isActive]="activeCategory === 'urgent'"
      >Urgent</app-button
    >
  </div>
</section>
