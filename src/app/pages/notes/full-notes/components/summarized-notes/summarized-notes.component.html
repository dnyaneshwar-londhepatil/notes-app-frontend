<section class="summary-panel" aria-labelledby="summary-heading">
  <header class="summary-header">
    <h2 class="summary-title" id="summary-heading">
      <span class="summary-star" aria-hidden="true">&#10022;</span>
      AI Summary
    </h2>

    <app-button
      [variant]="'secondary'"
      [size]="'sm'"
      [rounded]="false"
      (clicked)="regenerateSummary()">
      {{ isGenerating() ? 'Generating...' : 'Regenerate' }}
    </app-button>
  </header>

  @if (error()) {
    <p role="alert">{{ error() }}</p>
  } @else if (isGenerating() && !typedSummary()) {
    <p role="status">Generating summary...</p>
  } @else if (typedSummary()) {
    <p class="summary-text" [class.summary-text--typing]="isTyping()">
      {{ typedSummary() }}
    </p>
  } @else {
    <p class="summary-empty">Generate a summary from the note card.</p>
  }
</section>
