<div class="note-card" data-id="3">
  <app-tag [status]="note()?.category || 'all'">
    {{ note()?.category | uppercase }}
  </app-tag>

  <h3 class="note-title primary-font-semibold">{{ note()?.title }}</h3>
  <p class="note-body primary-font-medium">
    {{ note()?.content }}
  </p>
  <div class="note-footer">
    <span class="note-date">{{ dateFormat() }}</span>
    <div class="note-actions">
      <app-button [size]="'sm'">
        <span class="action-buttons">
          <svg
            class="pin-icon"
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            width="17"
            height="17"
            viewBox="0 0 17 17"
          >
            <g></g>
            <path
              d="M8 11.5h1v5.5h-1v-5.5zM14 8.8v2.2h-11v-2.2l1.094-0.487 1.106-6.313-0.429-0.779-0.671-1.221h8.8l-0.672 1.221-0.428 0.779 1.106 6.312 1.094 0.488zM13 9.449l-0.986-0.44-0.092-0.524-1.168-6.659 0.17-0.309 0.285-0.517h-5.418l0.455 0.827-0.060 0.346-1.2 6.836-0.986 0.44v0.551h9v-0.551z"
              fill="#000000"
            />
          </svg>
        </span>
      </app-button>
      <app-button [size]="'sm'" (clicked)="handleDelete()">
        <span>
          <svg
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            width="17"
            height="17"
            viewBox="0 0 17 17"
            class="delete-icon"
          >
            <g></g>
            <path
              d="M10.935 2.016c-0.218-0.869-0.999-1.516-1.935-1.516-0.932 0-1.71 0.643-1.931 1.516h-3.569v1h11v-1h-3.565zM9 1.5c0.382 0 0.705 0.221 0.875 0.516h-1.733c0.172-0.303 0.485-0.516 0.858-0.516zM13 4h1v10.516c0 0.827-0.673 1.5-1.5 1.5h-7c-0.827 0-1.5-0.673-1.5-1.5v-10.516h1v10.516c0 0.275 0.224 0.5 0.5 0.5h7c0.276 0 0.5-0.225 0.5-0.5v-10.516zM8 5v8h-1v-8h1zM11 5v8h-1v-8h1z"
              fill="#da2f2f"
            />
          </svg>
        </span>
      </app-button>
      <app-button
        [size]="'sm'"
        (clicked)="handleSummarize(note()?.content || '')"
      >
        <span>
          <svg
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            width="17"
            height="17"
            viewBox="0 0 17 17"
            class="summarize-icon"
          >
            <g></g>
            <path
              d="M9 0h-7c-0.552 0-1 0.448-1 1v14c0 0.552 0.448 1 1 1h8.5v-1h-8.5v-14h6v3c0 0.552 0.448 1 1 1h3v3.5h1v-4.207l-3.793-3.793zM10 3.5v-2.293l2.293 2.293h-2.293zM3 6h6v1h-6zM3 8.5h5v1h-5zM3 11h4v1h-4zM14.5 11.5c-0.138 0.69-0.517 1.241-1.5 1.5 0.983 0.259 1.362 0.81 1.5 1.5 0.138-0.69 0.517-1.241 1.5-1.5-0.983-0.259-1.362-0.81-1.5-1.5zM12 9.5c-0.1 0.5-0.376 0.899-1 1.085 0.624 0.187 0.9 0.586 1 1.085 0.1-0.5 0.376-0.899 1-1.085-0.624-0.187-0.9-0.585-1-1.085z"
              fill="#000000"
            />
          </svg>
        </span>
      </app-button>
    </div>
  </div>
</div>
