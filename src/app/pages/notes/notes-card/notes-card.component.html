<app-button [variant]="'default'" (clicked)="openNotePage()">
  <div class="note-card">
    <app-tag [status]="note()?.category || 'all'">
      {{ note()?.category | uppercase }}
    </app-tag>

    <h3 class="note-title primary-font-semibold">{{ note()?.title }}</h3>
    <p class="note-body primary-font-medium">
      {{ note()?.content }}
    </p>
    <div class="note-footer">
      <span class="note-date">{{ dateFormat() }}</span>
      <div class="note-actions">
        <app-button [size]="'sm'">
          <span class="action-buttons">
            <svg
              class="pin-icon"
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              width="17"
              height="17"
              viewBox="0 0 17 17"
            >
              <g></g>
              <path
                d="M8 11.5h1v5.5h-1v-5.5zM14 8.8v2.2h-11v-2.2l1.094-0.487 1.106-6.313-0.429-0.779-0.671-1.221h8.8l-0.672 1.221-0.428 0.779 1.106 6.312 1.094 0.488zM13 9.449l-0.986-0.44-0.092-0.524-1.168-6.659 0.17-0.309 0.285-0.517h-5.418l0.455 0.827-0.060 0.346-1.2 6.836-0.986 0.44v0.551h9v-0.551z"
                fill="#000000"
              />
            </svg>
          </span>
        </app-button>
        <app-button [size]="'sm'" (clicked)="handleDelete()">
          <span>
            <svg
              version="1.1"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              width="17"
              height="17"
              viewBox="0 0 17 17"
              class="delete-icon"
            >
              <g></g>
              <path
                d="M10.935 2.016c-0.218-0.869-0.999-1.516-1.935-1.516-0.932 0-1.71 0.643-1.931 1.516h-3.569v1h11v-1h-3.565zM9 1.5c0.382 0 0.705 0.221 0.875 0.516h-1.733c0.172-0.303 0.485-0.516 0.858-0.516zM13 4h1v10.516c0 0.827-0.673 1.5-1.5 1.5h-7c-0.827 0-1.5-0.673-1.5-1.5v-10.516h1v10.516c0 0.275 0.224 0.5 0.5 0.5h7c0.276 0 0.5-0.225 0.5-0.5v-10.516zM8 5v8h-1v-8h1zM11 5v8h-1v-8h1z"
                fill="#da2f2f"
              />
            </svg>
          </span>
        </app-button>
        <app-button
          [size]="'sm'"
          [isLoading]="isSummarizing()"
          [disabled]="isSummarizing()"
          (clicked)="handleSummarize(note()?.content || '')"
        >
          <span class="action-buttons">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              x="0px"
              y="0px"
              width="48"
              height="48"
              viewBox="0 0 48 48"
            >
              <path
                fill="#2196f3"
                d="M23.426,31.911l-1.719,3.936c-0.661,1.513-2.754,1.513-3.415,0l-1.719-3.936	c-1.529-3.503-4.282-6.291-7.716-7.815l-4.73-2.1c-1.504-0.668-1.504-2.855,0-3.523l4.583-2.034	c3.522-1.563,6.324-4.455,7.827-8.077l1.741-4.195c0.646-1.557,2.797-1.557,3.443,0l1.741,4.195	c1.503,3.622,4.305,6.514,7.827,8.077l4.583,2.034c1.504,0.668,1.504,2.855,0,3.523l-4.73,2.1	C27.708,25.62,24.955,28.409,23.426,31.911z"
              ></path>
              <path
                fill="#7e57c2"
                d="M38.423,43.248l-0.493,1.131c-0.361,0.828-1.507,0.828-1.868,0l-0.493-1.131	c-0.879-2.016-2.464-3.621-4.44-4.5l-1.52-0.675c-0.822-0.365-0.822-1.56,0-1.925l1.435-0.638c2.027-0.901,3.64-2.565,4.504-4.65	l0.507-1.222c0.353-0.852,1.531-0.852,1.884,0l0.507,1.222c0.864,2.085,2.477,3.749,4.504,4.65l1.435,0.638	c0.822,0.365,0.822,1.56,0,1.925l-1.52,0.675C40.887,39.627,39.303,41.232,38.423,43.248z"
              ></path>
            </svg>
          </span>
        </app-button>
      </div>
    </div>
  </div>
</app-button>
