<div class="delete-modal-container">
  <p class="primary-font-medium text">
    Are you sure, you want to delete this note.
  </p>

  <div class="button-container">
    <app-button [variant]="'secondary'" (clicked)="cancelDeleteAction()"
      >Cancel</app-button
    >
    <app-button [variant]="'warning'" (clicked)="handleDeleteNote()"
      >Delete</app-button
    >
  </div>
</div>
